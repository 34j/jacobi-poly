[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "jacobi-poly"
version = "1.0.6"
description = "Compute Jacobi polynomial from order 0 to N efficiently in NumPy / PyTorch / JAX / array API"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.13",
  "array-api-extra>=0.9.2",
  "numba>=0.63",
  "numpy>=2.3.5",
  "rich>=14.2",
  "scipy>=1.16.3",
  "typer>=0.21",
  "types-array-api>=1.2",
]
optional-dependencies.triplet = [
  "py3nj>=0.2.1; sys_platform!='darwin'",
]
urls."Bug Tracker" = "https://github.com/34j/jacobi-poly/issues"
urls.Changelog = "https://github.com/34j/jacobi-poly/blob/main/CHANGELOG.md"
urls.documentation = "https://jacobi-poly.readthedocs.io"
urls.repository = "https://github.com/34j/jacobi-poly"
scripts.jacobi-poly = "jacobi_poly.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "torch>=2.8",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]
cuda = [
  "numba-cuda[cu13]>=0.19",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
