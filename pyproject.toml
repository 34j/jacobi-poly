[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "jacobi-poly"
version = "1.0.6"
description = "Compute Jacobi polynomial from order 0 to N efficiently in NumPy / PyTorch / JAX / array API"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j", email = "34j.95a2p@simplelogin.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.13",
  "array-api-extra>=0.9.2",
  "numba>=0.63",
  "numpy>=2.3.5",
  "rich>=14.2",
  "scipy>=1.16.3",
  "typer>=0.21",
  "types-array-api>=1.2",
]
optional-dependencies.triplet = [
  "py3nj>=0.2.1",
]
urls."Bug Tracker" = "https://github.com/34j/jacobi-poly/issues"
urls.Changelog = "https://github.com/34j/jacobi-poly/blob/main/CHANGELOG.md"
urls.documentation = "https://jacobi-poly.readthedocs.io"
urls.repository = "https://github.com/34j/jacobi-poly"
scripts.jacobi-poly = "jacobi_poly.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "torch>=2.8",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]
cuda = [
  "numba-cuda[cu13]>=0.19",
]

[tool.ruff]
line-length = 100
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # flake8-docstrings
  "E",   # pycodestyle
  "F",   # pyflake
  "I",   # isort
  "RUF", # ruff specific
  "S",   # flake8-bandit
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D401", # First line of docstring should be in imperative mood
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."docs/conf.py" = [ "D100" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "S101",
]
lint.isort.known-first-party = [ "jacobi_poly", "tests" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
src.exclude = [ "docs/" ]
terminal.error-on-warning = true

[tool.pytest]
addopts = [
  "-v",
  "-Wonce",
  "-p no:doctest",
  "--cov=jacobi_poly",
  "--cov-report=term",
  "--cov-report=xml",
]
minversion = "9.0"
pythonpath = [ "src" ]

[tool.coverage]
run.branch = true
paths.source = [
  "src",
  ".tox/**/site-packages",
]
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
allow_zero_version = true
version_variables = [
  "docs/conf.py:release",
  "src/jacobi_poly/__init__.py:__version__",
]
version_toml = [ "pyproject.toml:project.version" ]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.environment.keep_trailing_newline = true
changelog.exclude_commit_patterns = [
  "chore(?:\\([^)]*?\\))?: .+",
  "ci(?:\\([^)]*?\\))?: .+",
  "refactor(?:\\([^)]*?\\))?: .+",
  "style(?:\\([^)]*?\\))?: .+",
  "test(?:\\([^)]*?\\))?: .+",
  "build\\((?!deps\\): .+)",
  "Merged? .*",
  "Initial [Cc]ommit.*",         # codespell:ignore
]
